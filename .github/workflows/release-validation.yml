name: Release validation
on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish verified 0.1.0 artifacts using the existing NPM_TOKEN, if available
        type: boolean
        default: false
      already_accepted:
        description: Comma-separated slugs previously accepted by npm; read back only, never republish
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: media-tool-release
  cancel-in-progress: false
jobs:
  artifacts:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate only current SDK differences
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund ai@7.0.143 @ai-sdk/mcp@2.0.78 @ai-sdk/openai-compatible@3.0.71
          npm run build
          node --test tests/mcp-version-contract.test.mjs
          npm run check
          mkdir -p artifacts
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const versions = Object.fromEntries(['ai', '@ai-sdk/mcp', '@ai-sdk/openai-compatible'].map(name => [name, JSON.parse(readFileSync(`node_modules/${name}/package.json`, 'utf8')).version]));
          if (versions.ai !== '7.0.143' || versions['@ai-sdk/mcp'] !== '2.0.78' || versions['@ai-sdk/openai-compatible'] !== '3.0.71') throw new Error('Installed version mismatch');
          console.log(versions);
          writeFileSync('artifacts/current-sdk-versions.json', JSON.stringify(versions, null, 2) + '\n');
          JS
      - name: Pack release artifacts
        run: npm run verify:packages
      - name: Save release checksums
        run: |
          sha256sum artifacts/packs/*.tgz | sed 's#artifacts/packs/##' > artifacts/packs/SHA256SUMS.txt
          cp artifacts/current-sdk-versions.json artifacts/packs/current-sdk-versions.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-sdk-media-0.1.0
          path: artifacts/packs/*
          retention-days: 30
  publish:
    needs: artifacts
    if: inputs.publish_npm && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: ai-sdk-media-0.1.0
          path: packages
      - name: Confirm existing publisher and publish fixed package artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_ALREADY_ACCEPTED: ${{ inputs.already_accepted }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'No existing NPM_TOKEN is available to this repository. No new token or permission was created.'
            exit 1
          fi
          npm whoami
          node scripts/publish-artifacts.mjs packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-publication-state
          path: publication-state.json
          if-no-files-found: warn
          retention-days: 90
